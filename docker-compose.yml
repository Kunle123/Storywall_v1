# Local dependencies for Storywall: Postgres, Redis, MinIO (S3-compatible).
# Run apps with: pnpm dev (from repo root) or per-package scripts.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storywall
      POSTGRES_PASSWORD: storywall
      POSTGRES_DB: storywall
    ports:
      - "5432:5432"
    volumes:
      - storywall_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storywall -d storywall"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storywall_minio:/data

volumes:
  storywall_pg:
  storywall_minio:
